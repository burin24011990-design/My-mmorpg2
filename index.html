<script>
// แสดง error ทั้งหมดเป็นรายการ (ไม่ทับกัน) -- ข้อ #1 คือต้นเหตุจริง | แตะกล่องเพื่อปิด
window.addEventListener('error', function (e) {
  var t = e.target && (e.target.src || e.target.href);
  var msg = t ? 'โหลดไม่ได้: ' + t.split('/').slice(-3).join('/') : 'Error: ' + e.message + ' (' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ')';
  var box = document.getElementById('err-box');
  if (!box) {
    box = document.createElement('div');
    box.id = 'err-box';
    box.style.cssText = 'position:fixed;left:0;right:0;top:0;max-height:45%;overflow:auto;z-index:99999;background:#400;color:#fff;font:12px monospace;padding:6px;white-space:pre-wrap;touch-action:pan-y';
    box.addEventListener('click', function () { box.style.display = 'none'; });
    document.body.appendChild(box);
  }
  box.style.display = 'block';
  var line = document.createElement('div');
  line.style.cssText = 'border-bottom:1px solid #800;padding:2px 0';
  line.textContent = '#' + (box.children.length + 1) + ' ' + msg;
  box.appendChild(line);
}, true);
</script>

<!-- ปุ่มกลับเข้าเต็มจอ -->
<div id="start-overlay">
  <div>
    <div class="btn">แตะเพื่อกลับเข้าเต็มจอ</div>
    <div class="sub">เกมจะหมุนเป็นแนวนอนและซ่อนแถบเบราว์เซอร์อัตโนมัติ</div>
  </div>

<script>
// ===== บังคับเต็มจอ + แนวนอน =====
// เบราว์เซอร์อนุญาตให้เข้าเต็มจอได้ต่อเมื่อผู้ใช้แตะจอเท่านั้น จึงเรียกจากปุ่ม "เริ่มเล่น"
// ถ้าติดตั้งเกมลงหน้าจอโฮม (เมนู ⋮ > เพิ่มลงหน้าจอหลัก/ติดตั้งแอป) แล้วเปิดจากไอคอน จะเต็มจอแนวนอนทันที
(function () {
  var ov = document.getElementById('start-overlay');
  var de = document.documentElement;
  var started = false;

  function isFS() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function isInstalled() {
    return (window.matchMedia && (window.matchMedia('(display-mode: fullscreen)').matches ||
            window.matchMedia('(display-mode: standalone)').matches)) || window.navigator.standalone === true;
  }
  function lockLandscape() {
    try {
      var o = screen.orientation;
      if (o && o.lock) { var p = o.lock('landscape'); if (p && p.catch) p.catch(function () {}); }
    } catch (e) {}
  }
  function nudgeResize() {
    setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 300);
    setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 800);
  }
  function hideOverlay() { ov.style.display = 'none'; }
  function showOverlay() { if (started && !isInstalled()) ov.style.display = 'flex'; }

  function enter() {
    if (isInstalled()) { lockLandscape(); hideOverlay(); return; }
    var req = de.requestFullscreen || de.webkitRequestFullscreen || de.msRequestFullscreen;
    if (!req) { hideOverlay(); return; }          // เช่น iPhone: ไม่รองรับเต็มจอ
    var p;
    try { p = req.call(de, { navigationUI: 'hide' }); } catch (e) { hideOverlay(); return; }
    Promise.resolve(p).then(function () {
      lockLandscape(); hideOverlay(); nudgeResize();
    }).catch(function () { hideOverlay(); });
  }
  window.GameFS = { enter: enter, setStarted: function () { started = true; } };

  ov.addEventListener('click', enter);
  function onFsChange() {
    if (isFS()) { lockLandscape(); hideOverlay(); }
    else showOverlay();                            // หลุดเต็มจอ -> ขึ้นปุ่มกลับเข้าเต็มจอ
    nudgeResize();
  }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);
  if (isInstalled()) lockLandscape();
})();

// ลงทะเบียน service worker เพื่อให้ติดตั้งลงหน้าจอโฮมแบบเต็มจอได้ (ไม่แคชไฟล์เกม)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
