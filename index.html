<title>My MMORPG</title>
<style>
  html, body { margin:0; height:100%; background:#111; overflow:hidden; touch-action:none; overscroll-behavior:none; }
  canvas { display:block; }
  #rotate-hint {
    display:none; position:fixed; inset:0; z-index:9999;
    background:#111; color:#fff; align-items:center; justify-content:center;
    text-align:center; font-size:18px; padding:24px; font-family:sans-serif;
  }
  @media (orientation: portrait) {
    #rotate-hint { display:flex; }
    canvas { display:none; }
  }

  /* หน้าจอเริ่มเกม: แตะ 1 ครั้งเพื่อเข้าเต็มจอ + ล็อกแนวนอน */
  #start-overlay {
    position:fixed; inset:0; z-index:10000; background:#111; color:#fff;
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-family:sans-serif; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  #start-overlay .title { font-size:28px; font-weight:bold; color:#ffe066; margin-bottom:16px; }
  #start-overlay .btn {
    display:inline-block; padding:14px 28px; border:2px solid #ffe066; border-radius:12px;
    font-size:20px; background:#1c1f24;
  }
  #start-overlay .sub { margin-top:14px; font-size:13px; color:#999; }
</style>
</head>
<body>
<script>
window.addEventListener('error', function (e) {
  var t = e.target && (e.target.src || e.target.href);
  var msg = t ? 'โหลดไม่ได้: ' + t.split('/').slice(-3).join('/') : 'Error: ' + e.message + ' (' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ')';
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#400;color:#fff;font:14px monospace;padding:6px;white-space:pre-wrap';
  d.textContent = msg;
  document.body.appendChild(d);
}, true);
</script>
<div id="rotate-hint">🔄<br>กรุณาหมุนจอเป็นแนวนอนเพื่อเล่นเกมนี้</div>

<div id="start-overlay">
  <div>
    <div class="title">My MMORPG</div>
    <div class="btn">แตะเพื่อเริ่มเล่นเต็มจอ</div>
    <div class="sub">เกมจะหมุนเป็นแนวนอนและซ่อนแถบเบราว์เซอร์อัตโนมัติ</div>
  </div>
</div>

<script>
// ===== บังคับเต็มจอ + แนวนอน =====
// เบราว์เซอร์อนุญาตให้เข้าเต็มจอได้ต่อเมื่อผู้ใช้แตะจอเท่านั้น จึงต้องแตะ 1 ครั้งตอนเปิดเกม
// ถ้าติดตั้งเกมลงหน้าจอโฮม (เมนู ⋮ > เพิ่มลงหน้าจอหลัก/ติดตั้งแอป) แล้วเปิดจากไอคอน จะเต็มจอแนวนอนทันทีโดยไม่ต้องแตะ
(function () {
  var ov = document.getElementById('start-overlay');
  var de = document.documentElement;

  function isFS() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function isInstalled() {
    return (window.matchMedia && (window.matchMedia('(display-mode: fullscreen)').matches ||
            window.matchMedia('(display-mode: standalone)').matches)) || window.navigator.standalone === true;
  }
  function lockLandscape() {
    try {
      var o = screen.orientation;
      if (o && o.lock) { var p = o.lock('landscape'); if (p && p.catch) p.catch(function () {}); }
    } catch (e) {}
  }
  function nudgeResize() {
    setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 300);
    setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 800);
  }
  function hideOverlay() { ov.style.display = 'none'; }
  function showOverlay() { if (!isInstalled()) ov.style.display = 'flex'; }

  function goFull() {
    var req = de.requestFullscreen || de.webkitRequestFullscreen || de.msRequestFullscreen;
    if (!req) { hideOverlay(); return; }          // เช่น iPhone: ไม่รองรับเต็มจอ ให้เข้าเกมเลย
    var p;
    try { p = req.call(de, { navigationUI: 'hide' }); } catch (e) { hideOverlay(); return; }
    Promise.resolve(p).then(function () {
      lockLandscape(); hideOverlay(); nudgeResize();
    }).catch(function () { hideOverlay(); });
  }

  ov.addEventListener('click', goFull);

  function onFsChange() {
    if (isFS()) { lockLandscape(); hideOverlay(); }
    else showOverlay();                            // ออกจากเต็มจอ -> ขึ้นหน้าแตะเพื่อกลับเข้าเต็มจอ
    nudgeResize();
  }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);

  if (isInstalled()) { hideOverlay(); lockLandscape(); }
})();

// ลงทะเบียน service worker เพื่อให้ติดตั้งลงหน้าจอโฮมแบบเต็มจอได้ (ไม่แคชไฟล์เกม)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
