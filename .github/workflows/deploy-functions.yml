name: Deploy Functions

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install functions dependencies
        working-directory: functions
        run: npm install

      - name: Write service account key
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$SA_KEY" > "$HOME/key.json"

      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/key.json
        run: npx -y firebase-tools deploy --only functions --project newworld-ae666 --non-interactive --force
